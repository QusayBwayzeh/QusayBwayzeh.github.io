<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Qusay's Full CV</title>
  <link rel="shortcut icon" type="image/x-icon" href="../static/img/qicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../static/style/redesign.css" rel="stylesheet">
</head>

<body>
  <div class="standalone-page">
    <div class="standalone-card">
      <a class="back-link" href="../">&larr; Back to Qusay's website</a>
      <div class="form-card">
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">
          <span class="eyebrow">Full CV</span>
          <h1 class="standalone-title" style="text-align:left;margin-bottom:0;">Request Qusay's Full CV</h1>
        </div>
        <p style="margin:0;font-size:14px;line-height:1.6;color:var(--text-dim);">Tell me a little about why you'd like a copy, and I'll send it over on WhatsApp or Email once approved.</p>
        <form id="requestForm">
          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required />
          </div>
		  <br/>

          <div class="field">
            <label for="justification">Justification & Email</label>
            <textarea id="justification" rows="3" placeholder="Why are you submitting this request?" required></textarea>
          </div>
		  <br/>

          <div class="field">
            <label for="mobileNumber">Mobile Number</label>
            <input type="text" id="mobileNumber" placeholder="07XXXXXXXX" pattern="07[0-9]{8}" required />
          </div>
		  <br/>

          <button type="submit" class="btn btn-primary" id="submitBtn">Submit Request</button>
        </form>

        <div id="alertSuccess" class="form-alert success"></div>
        <div id="alertError" class="form-alert error"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("requestForm");
    const alertSuccess = document.getElementById("alertSuccess");
    const alertError = document.getElementById("alertError");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      alertSuccess.classList.remove("is-visible");
      alertError.classList.remove("is-visible");

      const name = document.getElementById("name").value.trim();
      const justification = document.getElementById("justification").value.trim();
      const mobileNumber = document.getElementById("mobileNumber").value.trim();

      const requestData = { name, justification, mobileNumber };

      try {
        const response = await fetch("https://requestcv.runasp.net/api/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestData)
        });

        if (response.ok) {
          await response.json();
          alertSuccess.textContent = "Thank you, the request submitted successfully. You will receive the CV through WhatsApp once the request is approved.";
          alertSuccess.classList.add("is-visible");
          form.reset();
        } else {
          alertError.textContent = "Failed to submit, please try again later.";
          alertError.classList.add("is-visible");
        }
      } catch (err) {
        alertError.textContent = "Network error, please try again later.";
        alertError.classList.add("is-visible");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
